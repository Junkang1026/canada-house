<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍁 PLEASE PLEASE PLEASE 🍁</title>
  <link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Permanent+Marker&display=swap" rel="stylesheet" />
  <style>
    :root {
      --hot-pink: #ff00cc;
      --electric-blue: #00eeff;
      --lime: #aaff00;
      --orange: #ff6600;
      --purple: #cc00ff;
      --yellow: #ffff00;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: 'Boogaloo', cursive;
      background: #111;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    /* ── Animated disco background ── */
    #bg {
      position: fixed;
      inset: 0;
      background: linear-gradient(45deg, #ff00cc, #00eeff, #aaff00, #ff6600, #cc00ff);
      background-size: 400% 400%;
      animation: bgShift 2s ease infinite;
      z-index: 0;
      opacity: 0.25;
    }

    @keyframes bgShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ── Floating background emojis ── */
    .floater {
      position: fixed;
      font-size: 2rem;
      animation: floatUp linear infinite;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }
    @keyframes floatUp {
      0%   { transform: translateY(110vh) rotate(0deg); opacity: 0.5; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* ── Card ── */
    #card {
      position: relative;
      z-index: 10;
      background: #111;
      border: 6px solid var(--hot-pink);
      border-radius: 24px;
      padding: 48px 60px;
      text-align: center;
      box-shadow:
        0 0 30px var(--hot-pink),
        0 0 60px var(--electric-blue),
        0 0 100px var(--purple);
      max-width: 640px;
      width: 92vw;
      animation: cardPulse 1.5s ease-in-out infinite alternate;
    }

    @keyframes cardPulse {
      from { box-shadow: 0 0 30px var(--hot-pink), 0 0 60px var(--electric-blue); }
      to   { box-shadow: 0 0 60px var(--lime),     0 0 100px var(--orange); }
    }

    /* ── Title ── */
    .eyebrow {
      font-family: 'Permanent Marker', cursive;
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      color: var(--lime);
      letter-spacing: 4px;
      text-transform: uppercase;
      animation: flash 0.5s step-end infinite;
    }

    @keyframes flash {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    h1 {
      font-family: 'Permanent Marker', cursive;
      font-size: clamp(2rem, 7vw, 3.6rem);
      line-height: 1.15;
      margin: 12px 0 8px;
      background: linear-gradient(90deg, var(--hot-pink), var(--yellow), var(--electric-blue), var(--lime), var(--orange));
      background-size: 300% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: rainbowSlide 1.5s linear infinite;
      text-shadow: none;
    }

    @keyframes rainbowSlide {
      0%   { background-position: 0% center; }
      100% { background-position: 300% center; }
    }

    .subtitle {
      color: var(--electric-blue);
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      margin-bottom: 36px;
      animation: wobble 0.8s ease-in-out infinite;
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(-1deg); }
      50%       { transform: rotate(1deg); }
    }

    /* ── No-click drama counter ── */
    #drama {
      min-height: 28px;
      font-size: 1rem;
      color: var(--orange);
      margin-bottom: 16px;
      font-family: 'Permanent Marker', cursive;
      transition: all 0.2s;
    }

    /* ── Buttons ── */
    .btn-row {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    #yes-btn {
      padding: 18px 50px;
      font-family: 'Permanent Marker', cursive;
      font-size: 1.4rem;
      background: linear-gradient(135deg, var(--lime), var(--electric-blue));
      color: #111;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 20px var(--lime);
      transition: transform 0.15s, box-shadow 0.15s;
      animation: yesJump 0.6s ease-in-out infinite alternate;
    }

    @keyframes yesJump {
      from { transform: scale(1)   rotate(-1deg); }
      to   { transform: scale(1.06) rotate(1deg); }
    }

    #yes-btn:hover {
      box-shadow: 0 0 40px var(--lime), 0 0 80px var(--electric-blue);
    }

    /* No button — fixed so it can fly anywhere */
    #no-btn {
      padding: 16px 40px;
      font-family: 'Permanent Marker', cursive;
      font-size: 1.2rem;
      background: linear-gradient(135deg, var(--hot-pink), var(--purple));
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      position: fixed;
      box-shadow: 0 0 20px var(--hot-pink);
      transition: font-size 0.25s, padding 0.25s, box-shadow 0.25s;
      z-index: 20;
    }

    #no-btn:hover {
      animation: shake 0.15s linear infinite;
      box-shadow: 0 0 40px var(--hot-pink), 0 0 80px red;
    }

    @keyframes shake {
      0%   { transform: translate(0,0)       rotate(0deg); }
      20%  { transform: translate(-4px, 3px) rotate(-3deg); }
      40%  { transform: translate(4px, -3px) rotate(3deg); }
      60%  { transform: translate(-3px, 4px) rotate(-2deg); }
      80%  { transform: translate(3px, -4px) rotate(2deg); }
      100% { transform: translate(0,0)       rotate(0deg); }
    }

    /* ── Explosion particles ── */
    .particle {
      position: fixed;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 999;
      animation: burst linear forwards;
    }

    @keyframes burst {
      0%   { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
    }

    /* ── Screen shake ── */
    @keyframes screenShake {
      0%,100% { transform: translate(0,0); }
      10%  { transform: translate(-12px, 8px); }
      20%  { transform: translate(12px, -8px); }
      30%  { transform: translate(-8px, 12px); }
      40%  { transform: translate(8px, -12px); }
      50%  { transform: translate(-14px, 6px); }
      60%  { transform: translate(14px, -6px); }
      70%  { transform: translate(-6px, 14px); }
      80%  { transform: translate(6px, -14px); }
      90%  { transform: translate(-10px, 10px); }
    }

    body.shaking { animation: screenShake 0.5s linear; }

    /* ── Celebration overlay ── */
    #celebration {
      display: none;
      position: fixed;
      inset: 0;
      background: #111;
      z-index: 500;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 40px;
    }
    #celebration.show { display: flex; }

    #celebration h2 {
      font-family: 'Permanent Marker', cursive;
      font-size: clamp(2.5rem, 8vw, 5rem);
      background: linear-gradient(90deg, var(--hot-pink), var(--yellow), var(--lime), var(--electric-blue));
      background-size: 300% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: rainbowSlide 1s linear infinite;
      margin-bottom: 20px;
    }

    #celebration p {
      color: white;
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      line-height: 1.6;
    }

    .big-emoji {
      font-size: clamp(4rem, 12vw, 8rem);
      animation: spinBounce 0.8s ease-in-out infinite alternate;
      display: block;
      margin-bottom: 20px;
    }

    @keyframes spinBounce {
      from { transform: scale(1)   rotate(-10deg); }
      to   { transform: scale(1.2) rotate(10deg); }
    }
  </style>
</head>
<body>

<div id="bg"></div>

<div id="card">
  <div class="eyebrow">⚡ URGENT REQUEST ⚡</div>
  <h1>Please Accept Me<br>to Canada House</h1>
  <p class="subtitle">🇨🇦 I am LITERALLY begging you right now 🇨🇦</p>
  <div id="drama"></div>
  <div class="btn-row">
    <button id="yes-btn" onclick="celebrate()">✅ YES OBVIOUSLY</button>
    <button id="no-btn"  onclick="noClick()">❌ No</button>
  </div>
</div>

<div id="celebration">
  <span class="big-emoji">🍁🎉🍁</span>
  <h2>YESSSSS!!! I'M IN!!!</h2>
  <p>Pack the bags. Buy the mittens.<br>
     Canada House, HERE I COME! 🇨🇦🦫🌨️</p>
</div>

<script>
  // ── Floating background emojis ──
  const floatEmojis = ['🍁','🇨🇦','🦫','🌨️','🏒','🍺','❓','⭐','💥','🎉'];
  for (let i = 0; i < 18; i++) {
    const el = document.createElement('div');
    el.className = 'floater';
    el.textContent = floatEmojis[Math.floor(Math.random() * floatEmojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (6 + Math.random() * 8) + 's';
    el.style.animationDelay = (-Math.random() * 10) + 's';
    el.style.fontSize = (1.5 + Math.random() * 2) + 'rem';
    document.body.appendChild(el);
  }

  // ── Web Audio context for sound effects ──
  let audioCtx;
  function getAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playTone(freq, type, duration, vol = 0.3) {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.3, ctx.currentTime + duration);
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.start(); osc.stop(ctx.currentTime + duration);
  }

  function playSadWah() {
    // descending wah for No
    [400, 300, 200, 120].forEach((f, i) => setTimeout(() => playTone(f, 'sawtooth', 0.18, 0.25), i * 80));
  }

  function playFanfare() {
    // ascending triumphant fanfare for Yes
    [261, 330, 392, 523, 659, 784].forEach((f, i) =>
      setTimeout(() => playTone(f, 'square', 0.3, 0.4), i * 100)
    );
  }

  // ── No button state ──
  let noClicks = 0;
  let noFontSize  = 19;
  let noPadY      = 16;
  let noPadX      = 40;

  const noBtn = document.getElementById('no-btn');
  const drama = document.getElementById('drama');

  const dramaLines = [
    "seriously?? 😤",
    "ok RUDE 😤😤",
    "you're gonna regret this 😡",
    "EXCUSE ME??? 🤬",
    "my lawyer will hear about this",
    "i'm telling my mom 😭",
    "FINE. I'll ask the beaver.",
    "you monster 👹",
    "I'm not crying YOU'RE crying 😭",
    "this is NOT over 🫵",
    "i have screenshots 📸",
    "RECOUNT THE VOTES",
    "i'll remember this 😤",
    "ok at this point you're just being mean",
    "the audacity 😤😤😤",
    "i'm going to Tim Hortons and you're not invited",
  ];

  // Place No button near its natural spot on load
  (function initNo() {
    const row = document.querySelector('.btn-row');
    const rect = row.getBoundingClientRect();
    noBtn.style.left = (rect.left + rect.width * 0.6) + 'px';
    noBtn.style.top  = rect.top + 'px';
    noBtn.style.fontSize = noFontSize + 'px';
    noBtn.style.padding  = noPadY + 'px ' + noPadX + 'px';
  })();

  function noClick() {
    noClicks++;
    playSadWah();

    // Shrink
    noFontSize = Math.max(7,  noFontSize * 0.80);
    noPadY     = Math.max(4,  noPadY     * 0.80);
    noPadX     = Math.max(8,  noPadX     * 0.80);
    noBtn.style.fontSize = noFontSize + 'px';
    noBtn.style.padding  = noPadY + 'px ' + noPadX + 'px';

    // Fly to a random corner-ish position
    const w = noBtn.offsetWidth  || 60;
    const h = noBtn.offsetHeight || 30;
    const corners = [
      { x: 10, y: 10 },
      { x: window.innerWidth - w - 10, y: 10 },
      { x: 10, y: window.innerHeight - h - 10 },
      { x: window.innerWidth - w - 10, y: window.innerHeight - h - 10 },
    ];
    // pick a random corner, with some jitter
    const c = corners[Math.floor(Math.random() * corners.length)];
    noBtn.style.left = (c.x + (Math.random() - 0.5) * 80) + 'px';
    noBtn.style.top  = (c.y + (Math.random() - 0.5) * 60) + 'px';

    // Drama text
    drama.textContent = dramaLines[Math.min(noClicks - 1, dramaLines.length - 1)];

    // Mini explosion where the button WAS
    spawnExplosion(
      parseInt(noBtn.style.left) + w / 2,
      parseInt(noBtn.style.top)  + h / 2,
      10, ['#ff00cc','#ffff00','#ff6600']
    );
  }

  // ── Explosion particles ──
  function spawnExplosion(cx, cy, count, colors) {
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = (i / count) * 360;
      const dist  = 80 + Math.random() * 120;
      const tx = Math.cos(angle * Math.PI / 180) * dist;
      const ty = Math.sin(angle * Math.PI / 180) * dist;
      p.style.cssText = `
        left:${cx}px; top:${cy}px;
        background:${colors[Math.floor(Math.random() * colors.length)]};
        --tx:${tx}px; --ty:${ty}px;
        animation-duration:${0.5 + Math.random() * 0.5}s;
        width:${8 + Math.random() * 12}px;
        height:${8 + Math.random() * 12}px;
        border-radius:${Math.random() > 0.5 ? '50%' : '3px'};
      `;
      document.body.appendChild(p);
      p.addEventListener('animationend', () => p.remove());
    }
  }

  function celebrate() {
    playFanfare();

    // MASSIVE explosion from center
    spawnExplosion(window.innerWidth / 2, window.innerHeight / 2, 60,
      ['#ff00cc','#00eeff','#aaff00','#ffff00','#ff6600','#cc00ff','#ffffff']);

    // Screen shake
    document.body.classList.add('shaking');
    document.body.addEventListener('animationend', () => document.body.classList.remove('shaking'), { once: true });

    // Show celebration after brief delay
    setTimeout(() => {
      document.getElementById('celebration').classList.add('show');
      // Keep exploding confetti
      const interval = setInterval(() => {
        spawnExplosion(
          Math.random() * window.innerWidth,
          Math.random() * window.innerHeight,
          20,
          ['#ff00cc','#00eeff','#aaff00','#ffff00','#ff6600','#cc00ff']
        );
      }, 400);
      setTimeout(() => clearInterval(interval), 6000);
    }, 400);
  }
</script>
</body>
</html>
