<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A humble request</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #ffffff;
    }

    h1 {
      margin-bottom: 20px;
      color: #222;
      font-size: 28px;
    }

    img {
      width: 200px;
      margin-bottom: 24px;
      border-radius: 12px;
    }

    button {
      padding: 15px 30px;
      font-size: 20px;
      margin: 10px;
      cursor: pointer;
      border-radius: 8px;
      background-color: white;
    }

    .yes-button {
      border: 2px solid #4caf50;
      color: #4caf50;
    }

    .no-button {
      border: 2px solid #e53935;
      color: #e53935;
    }
  </style>
</head>
<body>

<h1>Will you be so kind to accept me as dorm mate? 🏠</h1>

<div style="display:flex; justify-content:space-between; width:400px; max-width:90vw;">
  <button class="yes-button" onclick="handleYesClick()">Yes 😊</button>
  <button class="no-button"  onclick="handleNoClick()">No 😐</button>
</div>

<script>
  let messageIndex = 0;

  const messages = [
    "No 😐",
    "Plz dont say no 😢",
    "I will do literally anything except gay shit 😭",
    "Im gonna diddy u if u keep pressing no 😡",
    "My heart is breaking 💔",
    "I'm begging you 🙏",
    "Come on bro... 😔",
    "I'll buy you food 🍕",
    "okay now you're just being CRUEL 💀",
  ];

  function handleNoClick() {
    const noButton  = document.querySelector('.no-button');
    const yesButton = document.querySelector('.yes-button');

    messageIndex = (messageIndex + 1) % messages.length;
    noButton.textContent = messages[messageIndex];

    const currentSize = parseFloat(window.getComputedStyle(yesButton).fontSize);
    yesButton.style.fontSize = (currentSize * 1.5) + 'px';
  }

  function handleYesClick() {
    document.body.innerHTML = `
      <h1>YESSS!!! 🎉</h1>
      <h2>We're gonna be the best dorm mates ever!!</h2>
      <p>This is the beginning of a beautiful friendship 🤝</p>
    `;
  }
</script>

</body>
</html>
